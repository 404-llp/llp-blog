# Cloudflare Pages 项目配置
# 控制台部署时这些设置也可以在 Pages 项目的 "Settings → Build" 里填
name = "personal-blog"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# 阅读计数用的 KV 存储（可选）。
